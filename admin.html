<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin | Bath Retreats</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1f19">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .adm { max-width: 860px; margin: 0 auto; padding: 40px var(--gutter) 96px; }
  .adm h1 { font-size: 34px; margin-bottom: 8px; }
  .adm-login { display: flex; gap: 10px; max-width: 460px; margin-top: 24px; }
  .adm-login input { flex: 1; height: 50px; padding: 0 16px; border: 1px solid var(--line); border-radius: 14px; font: 16px "Inter", sans-serif; }
  .adm-filters { margin: 24px 0 16px; }
  .adm-list { display: grid; gap: 14px; }
  .adm-item { padding: 20px 22px; border: 1px solid var(--line); border-radius: 18px; background: #fff; }
  .adm-item header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 14px; }
  .adm-item p { margin: 10px 0 14px; white-space: pre-wrap; }
  .adm-badge { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .adm-badge--pending { background: #fff4d6; color: #7a5600; }
  .adm-badge--approved { background: var(--lime-soft); color: #3f7d16; }
  .adm-badge--rejected { background: #fde2e0; color: #a3291d; }
  .adm-stars { color: var(--lime-deep); letter-spacing: 1px; }
  .adm-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .adm-actions .btn { padding: 10px 16px; }
  .adm-empty { padding: 40px; text-align: center; color: var(--ink-soft); }
  .adm-views { margin-top: 24px; }
  .adm-search { width: 100%; height: 46px; margin: 16px 0; padding: 0 16px; border: 1px solid var(--line); border-radius: 14px; font: 15px "Inter", sans-serif; }
  .adm-booking dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 12px 0 0; font-size: 14px; }
  .adm-booking dt { color: var(--ink-soft); }
  .adm-booking dd { margin: 0; }
  .adm-badge--confirmed { background: var(--lime-soft); color: #3f7d16; }
  .adm-badge--failed, .adm-badge--cancelled { background: #fde2e0; color: #a3291d; }
  .adm-badge--test { background: #e8eefc; color: #2b4aa0; }
</style>
</head>
<body class="co-page">

<header class="co-top">
  <a href="index.html" class="nav__logo">Bath Retreats</a>
  <span class="co-back">Admin</span>
</header>

<main class="adm">
  <h1>Admin</h1>
  <p class="small">Direct bookings with guest details, and guest reviews. Guest details are kept only here, not in Guesty.</p>

  <form class="adm-login" id="login">
    <input type="password" name="password" placeholder="Admin password" autocomplete="current-password" required>
    <button class="btn btn--dark">Sign in</button>
  </form>
  <p class="co-error" id="msg" role="alert"></p>

  <div id="panel" hidden>
    <div class="seg seg--lg adm-views" role="tablist" aria-label="Section">
      <button type="button" data-view="bookings" aria-selected="true">Bookings</button>
      <button type="button" data-view="reviews" aria-selected="false">Reviews</button>
    </div>

    <section id="bookingsView">
      <input class="adm-search" id="bookingSearch" type="search" placeholder="Search by name, email, phone or reference">
      <div class="adm-list" id="bookingList"></div>
    </section>

    <section id="reviewsView" hidden>
    <p class="small">New reviews stay hidden until you approve them. Approved reviews appear in the Reviews section of the property's page and the home page (newest three).</p>
    <div class="seg adm-filters" role="tablist" aria-label="Filter">
      <button type="button" data-filter="pending" aria-selected="true">Pending</button>
      <button type="button" data-filter="approved" aria-selected="false">Approved</button>
      <button type="button" data-filter="rejected" aria-selected="false">Rejected</button>
    </div>
    <div class="adm-list" id="list"></div>
    </section>
  </div>
</main>

<script>
(() => {
  "use strict";
  const $ = s => document.querySelector(s);
  const NAMES = { abbey: "Abbey Views", manor: "Longscroft Manor" };
  const fmt = new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", year: "numeric" });
  // Remembered for this browser tab only.
  const store = { get: () => { try { return sessionStorage.getItem("adminPw") || ""; } catch { return ""; } },
                  set: v => { try { v ? sessionStorage.setItem("adminPw", v) : sessionStorage.removeItem("adminPw"); } catch {} } };
  let password = store.get(), items = [], filter = "pending", bookings = [];
  const money = (pence, currency) => new Intl.NumberFormat("en-GB", { style: "currency", currency }).format(pence / 100);
  const day = s => fmt.format(new Date(`${s}T12:00:00`));

  async function api(path, body) {
    const res = await fetch(`/api/admin${path}`, {
      method: body ? "POST" : "GET",
      headers: { Authorization: `Bearer ${password}`, ...(body ? { "Content-Type": "application/json" } : {}) },
      ...(body ? { body: JSON.stringify(body) } : {}),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(data.error || "Something went wrong."), { status: res.status });
    return data;
  }

  async function load() {
    try {
      [items, bookings] = await Promise.all([api("/reviews").then(d => d.reviews), api("/bookings").then(d => d.bookings)]);
      store.set(password);
      $("#login").hidden = true;
      $("#panel").hidden = false;
      $("#msg").textContent = "";
      render();
      renderBookings();
    } catch (err) {
      if (err.status === 401) { password = ""; store.set(""); }
      $("#msg").textContent = err.message;
    }
  }

  function render() {
    document.querySelectorAll("[data-filter]").forEach(b => {
      const n = items.filter(r => r.status === b.dataset.filter).length;
      b.textContent = `${b.dataset.filter[0].toUpperCase()}${b.dataset.filter.slice(1)} (${n})`;
      b.setAttribute("aria-selected", b.dataset.filter === filter);
    });
    const shown = items.filter(r => r.status === filter);
    const list = $("#list");
    if (!shown.length) { list.innerHTML = `<p class="adm-empty">No ${filter} reviews.</p>`; return; }
    list.replaceChildren(...shown.map(r => {
      const el = document.createElement("article");
      el.className = "adm-item";
      el.innerHTML = `<header><span class="adm-badge adm-badge--${r.status}"></span><b></b><span class="adm-stars"></span><span class="prop"></span><span class="date small" style="margin:0"></span></header><p></p><div class="adm-actions"></div>`;
      el.querySelector(".adm-badge").textContent = r.status;
      el.querySelector("b").textContent = r.name;
      el.querySelector(".adm-stars").textContent = "★".repeat(r.rating) + "☆".repeat(5 - r.rating);
      el.querySelector(".prop").textContent = NAMES[r.stay] || r.stay;
      el.querySelector(".date").textContent = fmt.format(new Date(r.createdAt));
      el.querySelector("p").textContent = r.text; // guest-written: text only, never HTML
      const actions = el.querySelector(".adm-actions");
      const button = (label, action, cls) => {
        const b = document.createElement("button");
        b.type = "button"; b.className = `btn ${cls}`; b.textContent = label;
        b.addEventListener("click", () => act(r.id, action));
        actions.append(b);
      };
      if (r.status !== "approved") button("Approve", "approve", "btn--dark");
      if (r.status !== "rejected") button("Reject", "reject", "btn--light");
      button("Delete", "delete", "btn--light");
      return el;
    }));
  }

  function renderBookings() {
    const term = $("#bookingSearch").value.trim().toLowerCase();
    const shown = bookings.filter(b => !term || [b.reference, b.first_name, b.last_name, b.email, b.phone].join(" ").toLowerCase().includes(term));
    const list = $("#bookingList");
    if (!shown.length) { list.innerHTML = `<p class="adm-empty">${bookings.length ? "No bookings match." : "No direct bookings yet."}</p>`; return; }
    list.replaceChildren(...shown.map(b => {
      const el = document.createElement("article");
      el.className = "adm-item adm-booking";
      el.innerHTML = `<header><span class="adm-badge"></span><span class="adm-badge adm-badge--test" hidden>test</span><b></b><span class="prop"></span></header><dl></dl>`;
      const badge = el.querySelector(".adm-badge");
      badge.textContent = b.status; badge.classList.add(`adm-badge--${b.status}`);
      el.querySelector(".adm-badge--test").hidden = !b.test;
      el.querySelector("b").textContent = b.reference;
      el.querySelector(".prop").textContent = NAMES[b.stay] || b.stay;
      const rows = [
        ["Guest", `${b.first_name} ${b.last_name}`],
        ["Email", b.email, `mailto:${b.email}`],
        ["Mobile", b.phone || "–", b.phone ? `tel:${b.phone}` : null],
        ["Stay", `${day(b.check_in)} – ${day(b.check_out)} · ${b.guest_count} guest${b.guest_count === 1 ? "" : "s"}`],
        ["Paid", money(b.amount_pence, b.currency)],
        ["Marketing", b.marketing_opt_in ? "Opted in" : "No"],
        ["Booked", fmt.format(new Date(b.created_at))],
      ];
      const dl = el.querySelector("dl");
      for (const [label, value, href] of rows) {
        const dt = document.createElement("dt"), dd = document.createElement("dd");
        dt.textContent = label;
        if (href) { const a = document.createElement("a"); a.href = href; a.textContent = value; dd.append(a); } else dd.textContent = value;
        dl.append(dt, dd);
      }
      return el;
    }));
  }
  $("#bookingSearch").addEventListener("input", renderBookings);
  document.addEventListener("click", e => {
    const v = e.target.closest("[data-view]");
    if (!v) return;
    document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-selected", b === v));
    $("#bookingsView").hidden = v.dataset.view !== "bookings";
    $("#reviewsView").hidden = v.dataset.view !== "reviews";
  });

  async function act(id, action) {
    if (action === "delete" && !confirm("Delete this review permanently?")) return;
    try { await api(`/reviews/${id}`, { action }); await load(); } catch (err) { $("#msg").textContent = err.message; }
  }

  $("#login").addEventListener("submit", e => { e.preventDefault(); password = e.target.password.value; load(); });
  document.addEventListener("click", e => { const b = e.target.closest("[data-filter]"); if (b) { filter = b.dataset.filter; render(); } });
  if (password) load();
})();
</script>
</body>
</html>
